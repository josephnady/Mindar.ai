# Activate with --spring.profiles.active=prod
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mindar}
spring.datasource.username=${DATABASE_USERNAME:mindar}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

mindar.jwt.secret=${MINDAR_JWT_SECRET}

# Tighter actuator exposure in prod: no raw env values, no H2 console (already
# off above via spring.h2.console.enabled=false).
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=never
