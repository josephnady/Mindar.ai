spring.application.name=mindar-backend
# --- Local/dev DB (H2, in-memory). Swap for Postgres in application-prod.properties ---
spring.datasource.url=jdbc:h2:mem:mindar;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# IMPORTANT: override this via an environment variable in real deployments,
# e.g. MINDAR_JWT_SECRET, and never commit a real secret.
mindar.jwt.secret=${MINDAR_JWT_SECRET:change-this-to-a-long-random-secret-before-deploying}
mindar.jwt.expiration-ms=604800000

server.port=8080

# --- Actuator: expose /actuator/info and /actuator/env so you can confirm
# which profile/environment is actually running (see README "Which environment am I running?") ---
management.endpoints.web.exposure.include=health,info,env
management.endpoint.env.show-values=when-authorized
info.app.name=mindar-backend
spring.profiles.active=default
info.app.profile.active=${spring.profiles.active}

logging.level.root.hibernate.SQL=DEBUG
logging.level.root.hibernate.orm.jdbc.bind=TRACE